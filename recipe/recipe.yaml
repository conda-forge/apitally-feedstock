# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.25.1"

package:
  name: apitally
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apitally/apitally-${{ version }}.tar.gz
  sha256: 2681e925deffbc94eb7fc65e1f0db397df58634ab1d90597be458d69b2185f7b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - backoff >=2.0.0
    - opentelemetry-sdk <2.0.0,>=1.39.1
    - psutil >=5.9.6
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://apitally.io
  license: MIT
  license_file: LICENSE
  summary: Simple API monitoring & analytics for REST APIs built with FastAPI, Flask, Django, Starlette, Litestar and BlackSheep.
  description: |
    Simple API monitoring & analytics for REST APIs built with FastAPI, Flask, Django, Starlette, Litestar and BlackSheep.
  repository: https://github.com/apitally/apitally-py
  documentation: https://docs.apitally.io

extra:
  recipe-maintainers:
    - rxm7706
