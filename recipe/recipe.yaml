# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 1.0.0

package:
  name: apitally
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/apitally/apitally-${{ version }}.tar.gz
  sha256: 8682cb8121cbcbf53b614e36496fb9fd1cf3697ebf48df6c55c91e446f44627a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - opentelemetry-sdk >=1.42.0,<2.0.0
    - psutil >=5.9.0
    - requests >=2.26.0
    - opentelemetry-api >=1.42.0,<2.0.0
    - opentelemetry-instrumentation-logging >=0.63b0
    - opentelemetry-instrumentation >=0.63b0
    - opentelemetry-proto >=1.42.0,<2.0.0
tests:
  - python:
      imports:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://apitally.io
  license: MIT
  license_file: LICENSE
  summary: Simple API monitoring & analytics for REST APIs built with FastAPI, Flask, Django, Starlette, Litestar and BlackSheep.
  description: |
    Simple API monitoring & analytics for REST APIs built with FastAPI, Flask, Django, Starlette, Litestar and BlackSheep.
  repository: https://github.com/apitally/apitally-py
  documentation: https://docs.apitally.io

extra:
  recipe-maintainers:
    - rxm7706
